name: Build

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

on:
  workflow_dispatch:
  push:
    branches:
      - master
      - main
    paths-ignore:
      - '*.md'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4
        with:
          path: "src"
          fetch-depth: 0

      - name: Checkout Builds Branch
        uses: actions/checkout@v4
        with:
          ref: "builds"
          path: "builds"

      - name: Setup JDK 17
        uses: actions/setup-java@v5.2.0
        with:
          distribution: "adopt"
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4.0.1

      - name: Remove comments from source files
        working-directory: "src"
        shell: python
        run: |
          import os
          import re

          pattern = re.compile(r'^\s*//.*\r?\n?', re.MULTILINE)

          for root, dirs, files in os.walk('.'):
              dirs[:] = [d for d in dirs if not d.startswith('.')]
              for file in files:
                  if file.endswith('.kt') or file.endswith('.kts'):
                      file_path = os.path.join(root, file)
                      try:
                          with open(file_path, 'r', encoding='utf-8', errors='ignore') as f:
                              content = f.read()
                          
                          cleaned_content = pattern.sub('', content)
                          
                          if cleaned_content != content:
                              with open(file_path, 'w', encoding='utf-8') as f:
                                  f.write(cleaned_content)
                              print(f"Removed comments from: {file_path}")
                      except Exception as e:
                          print(f"Error processing {file_path}: {e}")

      - name: Update build.gradle.kts from plugins.json
        working-directory: "src"
        shell: python
        run: |
          import json
          import os
          import urllib.request
          import difflib
          import re

          url = "https://raw.githubusercontent.com/Abodabodd/re-3arabi/refs/heads/main/plugins.json"

          try:
              response = urllib.request.urlopen(url)
              data = json.loads(response.read().decode('utf-8'))
          except Exception as e:
              exit(1)

          dirs = [d for d in os.listdir('.') if os.path.isdir(d) and not d.startswith('.')]

          def strict_clean(text):
              return re.sub(r'[^a-z0-9]', '', text.lower())

          dir_map = {strict_clean(d): d for d in dirs}

          manual_map = {
              "fullmatchshows": "replaymatch",
              "shabakatycinemana": "cinemana",
              "shabakatcinemana": "cinemana",
              "cee": "Cee",
              "cimanaw": "CimaNowProvider",
              "cimanawprovider": "CimaNowProvider",
              "eshek": "eseek",
              "brstege": "bristege",
          }

          for item in data:
              internal_name = item.get("internalName", "")
              name = item.get("name", "")
              
              target_dir = None
              cleaned_internal = strict_clean(internal_name)
              cleaned_name = strict_clean(name)
              
              mapped_folder = manual_map.get(cleaned_internal) or manual_map.get(cleaned_name)
              if mapped_folder:
                  for d in dirs:
                      if strict_clean(d) == strict_clean(mapped_folder):
                          target_dir = d
                          break
              
              if not target_dir:
                  if cleaned_internal in dir_map:
                      target_dir = dir_map[cleaned_internal]
                  elif cleaned_name in dir_map:
                      target_dir = dir_map[cleaned_name]
              
              if not target_dir:
                  for clean_d, actual_d in dir_map.items():
                      if clean_d in cleaned_internal or cleaned_internal in clean_d or clean_d in cleaned_name or cleaned_name in clean_d:
                          target_dir = actual_d
                          break

              if not target_dir:
                  matches = difflib.get_close_matches(internal_name, dirs, n=1, cutoff=0.5)
                  if not matches:
                      matches = difflib.get_close_matches(name, dirs, n=1, cutoff=0.5)
                  if matches:
                      target_dir = matches[0]

              if target_dir:
                  gradle_path = os.path.join(target_dir, "build.gradle.kts")
                  
                  existing_content = ""
                  if os.path.exists(gradle_path):
                      with open(gradle_path, "r", encoding="utf-8") as f:
                          existing_content = f.read()

                  if re.search(r'\bname\s*=', existing_content):
                      print(f"Skipping {gradle_path} because it already has a custom name configured.")
                      continue
                  
                  version = item.get("version", 1)
                  description = item.get("description", "")
                  authors = item.get("authors", ["Abodabodd"])
                  language = item.get("language", "ar")
                  status = item.get("status", 1)
                  tv_types = item.get("tvTypes", [])
                  icon_url = item.get("iconUrl", "")
                  
                  authors_kotlin = ", ".join([f'"{a}"' for a in authors])
                  tv_types_kotlin = ",\n        ".join([f'"{t}"' for t in tv_types])
                  
                  content = f"""version = {version}

          cloudstream {{
              description = "{description}"
              authors = listOf({authors_kotlin})
              language = "{language}"

              status = {status}

              tvTypes = listOf(
                  {tv_types_kotlin}
              )

              iconUrl = "{icon_url}"
          }}
          """
                  
                  if existing_content.strip() != content.strip():
                      print(f"Updating: {gradle_path} for {internal_name}...")
                      with open(gradle_path, "w", encoding="utf-8") as f:
                          f.write(content)

      - name: Push updated files back to source branch
        working-directory: "src"
        run: |
          git config --local user.email "actions@github.com"
          git config --local user.name "GitHub Actions"
          git add -u
          git add plugins.json || echo "No plugins.json in source root"
          if [[ -n $(git status -s) ]]; then
            git commit -m "Sync names and config with plugins.json [skip ci]"
            git push origin HEAD:${{ github.ref_name }}
          else
            echo "No changes to push"
          fi

      - name: Access Secrets & Create Properties
        working-directory: "src"
        env:
          SIMKL_API: ${{ secrets.SIMKL_API }}
          TMDB_KEY: ${{ secrets.TMDB_KEY }}
          CASTLE_KEY: ${{ secrets.CASTLE_KEY }}
          MOVIEBLAST_TOKEN: ${{ secrets.MOVIEBLAST_TOKEN }}
          MOVIEBLAST_API: ${{ secrets.MOVIEBLAST_API }}
          MOVIEBLAST_KEY: ${{ secrets.MOVIEBLAST_KEY }}
        run: |
          touch local.properties
          echo "SIMKL_API=$SIMKL_API" >> local.properties
          echo "TMDB_KEY=$TMDB_KEY" >> local.properties
          echo "CASTLE_KEY=$CASTLE_KEY" >> local.properties
          echo "MOVIEBLAST_TOKEN=$MOVIEBLAST_TOKEN" >> local.properties
          echo "MOVIEBLAST_API=$MOVIEBLAST_API" >> local.properties
          echo "MOVIEBLAST_KEY=$MOVIEBLAST_KEY" >> local.properties

      - name: Build Plugins
        working-directory: "src"
        run: |
          echo "=== listing files in src folder ==="
          ls -la
          
          if [ -f "gradlew" ]; then
            echo "gradlew found, setting execution permissions..."
            chmod +x gradlew
            GRADLE_CMD="./gradlew"
          else
            echo "gradlew NOT found! Falling back to system gradle..."
            GRADLE_CMD="gradle"
          fi
          
          git_modules=""
          if git rev-parse --verify HEAD^ >/dev/null 2>&1; then
            git_modules=$(git diff --name-only HEAD^ HEAD 2>/dev/null | grep -v '^\.' | cut -d'/' -f1 | sort -u) || git_modules=""
          fi
          
          local_modules=$(git status --porcelain | grep -v '^\.' | awk '{print $2}' | cut -d'/' -f1 | sort -u) || local_modules=""
          all_modules=$(printf "%s\n%s" "$git_modules" "$local_modules" | sort -u | grep -v 'build.gradle.kts' | grep -v '^$') || all_modules=""
          
          build_commands=""
          for module in $all_modules; do
            if [ -d "$module" ] && [ "$module" != "builds" ] && [ "$module" != "src" ]; then
              build_commands="$build_commands :$module:make"
            fi
          done
          
          if [ -n "$build_commands" ]; then
            echo "Building modified modules: $build_commands"
            $GRADLE_CMD $build_commands makePluginsJson
          else
            echo "No specific modified modules detected (or manual run). Building all modules..."
            $GRADLE_CMD make makePluginsJson
          fi

          python3 -c "
          import json, urllib.request, os
          generated_path = 'build/plugins.json'
          existing_builds_path = os.path.join(os.environ.get('GITHUB_WORKSPACE', ''), 'builds', 'plugins.json')
          url = 'https://raw.githubusercontent.com/Abodabodd/re-3arabi/refs/heads/main/plugins.json'
          
          builds_name_map = {}
          try:
              if os.path.exists(existing_builds_path):
                  with open(existing_builds_path, 'r', encoding='utf-8') as f:
                      builds_data = json.loads(f.read())
                  builds_name_map = {item.get('internalName'): item.get('name') for item in builds_data if 'internalName' in item}
          except Exception as e:
              print(f'Error reading local builds: {e}')
              
          remote_name_map = {}
          try:
              response = urllib.request.urlopen(url)
              remote_data = json.loads(response.read().decode('utf-8'))
              remote_name_map = {item.get('internalName'): item.get('name') for item in remote_data if 'internalName' in item}
          except Exception as e:
              print(f'Error reading remote: {e}')
              
          try:
              if os.path.exists(generated_path):
                  with open(generated_path, 'r', encoding='utf-8') as f:
                      gen_data = json.loads(f.read())
                  for item in gen_data:
                      int_name = item.get('internalName')
                      if int_name in builds_name_map:
                          item['name'] = builds_name_map[int_name]
                          print(f'Preserved existing builds name for {int_name} -> {builds_name_map[int_name]}')
                      elif int_name in remote_name_map:
                          item['name'] = remote_name_map[int_name]
                          print(f'Set name for new plugin {int_name} from main branch -> {remote_name_map[int_name]}')
                  with open(generated_path, 'w', encoding='utf-8') as f:
                      json.dump(gen_data, f, indent=4, ensure_ascii=False)
          except Exception as e:
              print(f'Error merging names: {e}')
          "

          cp build/plugins.json ./plugins.json || echo "No plugins.json found in build"
          cp build/plugins.json $GITHUB_WORKSPACE/builds/plugins.json || echo "No plugins.json found in build"
          find . -type f -name "*.cs3" -exec cp {} $GITHUB_WORKSPACE/builds/ \; || echo "No .cs3 files found"
